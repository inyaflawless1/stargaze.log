<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Introduction to javascript</title>
    
<style>
      body{
            background-color: rgb(245, 246, 176);
        }
       section{
    background: white;
    padding: 1rem;
            }
            form{
    display: flex;
    gap: 0.7rem;
            }
        input{

        }
        input{
            padding: 0.6rem 0.9rem;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus{
            border-color: #4f46e5;
        }
        .add-btn{
 padding: 0.6rem 0.9rem;
 background: #4f46e5;
 color: white;
 border: none;
 border-radius: 8px;
 font-size: 0.9rem;
        }
        .add-btn:hover {
            background: #4338ca;
        }
        summary{
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.rem;
        }
        ul{
            gap: 0.5rem;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
        }
        li span{
            font-size: 0.95rem;
            color: #111827;
        }
        li button{
            background: none;
            border: 1px solid #f87171;
            color: #ef4444;
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
            font-size:  0.8rem;cursor: pointer;
        }
        li button:hover{
            background: #fee2e2;
        }
        </style>
</head>

<body style="background-color: rgb(204, 221, 104);">
<h1>Introduction to javascript</h1>
<section class="section">
    <h2> Shopping List </h2>
    <p class="summary"></p>

    <form>
        <div>
        <label for="itemContent">Add an items</label>
        <input   type="text" name="itemContent"
        id="itemContent"  placeholder="add an item">
        </div>
        <button class="add-btn" type="submit">Add</button>
    </form>
    <ul></ul>
    
</section>
<script src="practice.js"></script>
</body>

</html>
